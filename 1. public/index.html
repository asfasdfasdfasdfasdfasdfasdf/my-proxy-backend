<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Web Portal</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #202225; font-family: sans-serif; }
    #container { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #nav { padding: 10px; background: #2f3136; display: flex; gap: 10px; }
    input { flex: 1; padding: 8px; border: none; border-radius: 4px; background: #40444b; color: white; font-size: 14px; }
    button { padding: 8px 16px; border: none; border-radius: 4px; background: #5865f2; color: white; cursor: pointer; font-weight: bold; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
  </style>
  <!-- Load core Ultraviolet asset bundles -->
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
</head>
<body>
  <div id="container">
    <div id="nav">
      <input type="text" id="urlInput" value="https://discord.com">
      <button onclick="launchProxy()">Go</button>
    </div>
    <iframe id="proxyFrame"></iframe>
  </div>

  <script>
    // Register the custom Ultraviolet Service Worker scope
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix })
        .then(() => console.log("Ultraviolet engine registered inside target scope."))
        .catch(err => console.error("Engine generation failure:", err));
    }

    function launchProxy() {
      const inputVal = document.getElementById("urlInput").value.trim();
      let targetUrl = inputVal;

      // Automatically format plain search requests or append prefixes
      if (!/^https?:\/\//i.test(targetUrl)) {
        targetUrl = 'https://' + targetUrl;
      }

      const iframe = document.getElementById("proxyFrame");
      // Encode the destination URL via XOR and pass it to the frame context
      iframe.src = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
    }

    // Automatically load the default payload on launch
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(launchProxy, 500);
    });
  </script>
</body>
</html>
